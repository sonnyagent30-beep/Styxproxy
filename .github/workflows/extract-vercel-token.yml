name: Test Secrets
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ADD_KEY_API_KEY
        env:
          K: *** secrets.ADD_KEY_API_KEY }}
        run: |
          echo "Length: ${#K}"
          mkdir -p /tmp/secrets-test
          echo "$K" > /tmp/secrets-test/k.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: secret-test
          path: /tmp/secrets-test/k.txt
