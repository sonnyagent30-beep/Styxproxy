# Browser verification workflow - runs after deployment
name: Browser Verify

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to verify'
        required: false
        default: 'https://styxproxy.com'
        type: string
      environment:
        description: 'Environment (staging/production)'
        required: false
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  verify-site:
    name: Verify ${{ github.inputs.environment || 'production' }} site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install -g playwright

      - name: Install browser
        run: npx playwright install chromium

      - name: Run browser verification
        env:
          SITE_URL: ${{ github.inputs.site_url || 'https://styxproxy.com' }}
        run: |
          node scripts/browser-verify.js

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshot
          path: /tmp/verify-error-*.png
          retention-days: 7
