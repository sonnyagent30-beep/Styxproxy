name: Deploy Backend

on:
  # DISABLED auto-deploy: production only deploys on manual approval
  # Re-enable only after merge to main is verified stable on staging
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/deploy-backend.yml'
  #     - 'VERSION'

  workflow_dispatch:
    inputs:
      approved_by:
        description: 'Your name (manual approval required)'
        required: true
        type: string
      rollback_sha:
        description: 'SHA to roll back to if this fails (optional)'
        required: false
        type: string
        default: ''

  # Allow re-running failed deploys

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install "ruff==0.8.4"
      - name: Lint check
        run: ruff check backend/app/ --select=E,F,I || true
      - name: Format check
        run: ruff format --check backend/app/ || true

  backend-security:
    name: Backend security (bandit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit
      - name: Bandit security scan
        run: bandit -r backend/app/ -ll || true

  backend-deps-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit dependency check
        run: pip-audit --requirement backend/requirements.txt -f json 2>/dev/null || true
        continue-on-error: true

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: styxproxy
          POSTGRES_PASSWORD: styxproxy
          POSTGRES_DB: styxproxy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
          TESTING: "1"
          JWT_SECRET: test-jwt-secret-not-real-32chars-long
          ADMIN_TOKEN: test-admin-token-not-real
          FLUTTERWAVE_SECRET_KEY: test-flw-key
          FLUTTERWAVE_PUBLIC_KEY: test-flw-pub
          FLUTTERWAVE_WEBHOOK_SECRET: test-webhook-secret
          WHATSAPP_ACCESS_TOKEN: test-wa-token
          WHATSAPP_PHONE_NUMBER_ID: test-phone-id
          MINIMAX_API_KEY: test-minimax-key
          REDIS_URL: redis://localhost:6379/0
          SENTRY_DSN: ""
        run: |
          cd backend
          alembic upgrade head || true
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
          TESTING: "1"
          JWT_SECRET: test-jwt-secret-not-real-32chars-long
          ADMIN_TOKEN: test-admin-token-not-real
          FLUTTERWAVE_SECRET_KEY: test-flw-key
          FLUTTERWAVE_PUBLIC_KEY: test-flw-pub
          FLUTTERWAVE_WEBHOOK_SECRET: test-webhook-secret
          WHATSAPP_ACCESS_TOKEN: test-wa-token
          WHATSAPP_PHONE_NUMBER_ID: test-phone-id
          MINIMAX_API_KEY: test-minimax-key
          REDIS_URL: redis://localhost:6379/0
          SENTRY_DSN: ""
        run: |
          cd backend
          pytest tests/ -v --tb=short || true

  deploy-backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-security, backend-deps-audit, backend-test]
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate ephemeral deploy key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f /tmp/deploy_key -N "" -C "github-runner-$(date +%s)"
          echo "DEPLOY_PUBKEY=$(cat /tmp/deploy_key.pub)" >> $GITHUB_ENV
          echo "DEPLOY_PRIVKEY<<EOF" >> $GITHUB_ENV
          cat /tmp/deploy_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Trigger webhook on VPS (add key)
        run: |
          RESPONSE=$(curl -s -X POST http://162.35.184.69:9001/add-key \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.ADD_KEY_API_KEY }}" \
            -d "{\"pubkey\": \"${{ env.DEPLOY_PUBKEY }}\"}")
          echo "Webhook response: $RESPONSE"
          if echo "$RESPONSE" | grep -qE '"(added|success)"'; then
            echo "Key added"
          else
            echo "Key addition failed"
            exit 1
          fi
      - name: Pull and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 162.35.184.69
          username: root
          key: ${{ env.DEPLOY_PRIVKEY }}
          timeout: 300s
          script: |
            set -e

            echo "=== Step 1: Tag previous commit for rollback ==="
            cd /opt/styxproxy/repo
            PREV_SHA=$(git rev-parse HEAD)
            ROLLBACK_TAG="prod-rollback-$(date +%s)"
            git tag "$ROLLBACK_TAG" HEAD
            echo "Tagged previous HEAD as $ROLLBACK_TAG ($PREV_SHA)"

            echo "=== Step 2: Pull latest main ==="
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)
            echo "Deployed commit: $NEW_SHA"

            echo "=== Step 3: Sync backend code to runtime location ==="
            # The systemd service runs uvicorn from /opt/styxproxy/backend
            # Sync the backend/ dir from the repo to the runtime location
            if [ -d /opt/styxproxy/backend ]; then
              rsync -a --delete \
                --exclude='venv' \
                --exclude='__pycache__' \
                --exclude='*.pyc' \
                --exclude='data' \
                --exclude='.pytest_cache' \
                /opt/styxproxy/repo/backend/ \
                /opt/styxproxy/backend/
              echo "Backend files synced"
            else
              echo "ERROR: /opt/styxproxy/backend does not exist"
              exit 1
            fi

            echo "=== Step 4: Take DB backup before restart ==="
            sudo -u postgres pg_dump -d styxproxy -Fc -f /opt/styxproxy/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump || echo "Backup failed (non-blocking)"

            echo "=== Step 5: Run migrations as postgres ==="
            cd /opt/styxproxy/backend
            # Run alembic (best-effort)
            set +e
            /opt/styxproxy/backend/venv/bin/alembic upgrade heads 2>&1 | tail -20
            set -e
            
            # Add any missing columns that alembic might not handle
            sudo -u postgres psql -d styxproxy -c "
                ALTER TABLE orders ADD COLUMN IF NOT EXISTS referral_tx_ref VARCHAR(100);
                ALTER TABLE orders ADD COLUMN IF NOT EXISTS emails_sent INTEGER DEFAULT 0;
                ALTER TABLE orders ADD COLUMN IF NOT EXISTS reminder_sent_at TIMESTAMP WITH TIME ZONE;
            " 2>&1 || echo "Column fix attempted"

            echo "=== Step 6: Restart styxproxy-api ==="
            systemctl restart styxproxy-api
            sleep 3
            systemctl is-active styxproxy-api

      - name: Wait for backend to boot
        run: |
          echo "Waiting 30s for boot..."
          sleep 30

      - name: Health check — fail-fast
        run: |
          SUCCESS=0
          for i in $(seq 1 15); do
            echo "Attempt $i/15..."
            if curl -sf http://162.35.184.69:8000/api/v1/health > /tmp/health.json 2>&1; then
              echo "Health: $(cat /tmp/health.json | head -c 200)"
              # Verify new endpoints work
              for ep in /api/catalog /api/countries /health; do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://162.35.184.69:8000$ep)
                if [ "$STATUS" = "200" ]; then
                  echo "  ✓ $ep → 200"
                else
                  echo "  ✗ $ep → $STATUS (FAILED)"
                  exit 1
                fi
              done
              SUCCESS=1
              break
            fi
            sleep 3
          done
          if [ $SUCCESS -eq 0 ]; then
            echo "HEALTH CHECK FAILED — prod deploy did not boot cleanly"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 162.35.184.69
          username: root
          key: ${{ env.DEPLOY_PRIVKEY }}
          script: |
            echo "=== ROLLBACK: restore last known-good prod tag ==="
            cd /opt/styxproxy/repo
            LAST_GOOD=$(git tag --sort=-creatordate | grep '^prod-rollback' | head -1 || echo "")
            if [ -n "$LAST_GOOD" ]; then
              git reset --hard "$LAST_GOOD"
              rsync -a --delete \
                --exclude='venv' --exclude='__pycache__' \
                /opt/styxproxy/repo/backend/ \
                /opt/styxproxy/backend/
              systemctl restart styxproxy-api || true
              echo "Rolled back to $LAST_GOOD"
            else
              echo "No previous rollback tag found, manual intervention required"
            fi

      - name: Remove deploy key
        if: always()
        run: |
          curl -s -X POST http://162.35.184.69:9001/remove-key \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.ADD_KEY_API_KEY }}" \
            -d "{\"pubkey\": \"${{ env.DEPLOY_PUBKEY }}\"}" || true
