name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  VPS_HOST: 162.35.184.69
  VPS_USER: root
  VPS_REPO: /opt/styxproxy/repo
  VPS_BACKEND_CODE: /opt/styxproxy/backend

jobs:
  deploy-backend:
    name: Deploy to Interserver
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Debug SSH key
        run: |
          echo '=== Key length ==='
          echo ${{ secrets.INTERSERVER_SSH_KEY }} | wc -c
          echo '=== Key start ==='
          echo ${{ secrets.INTERSERVER_SSH_KEY }} | head -c 80

      - name: Debug SSH connection
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.INTERSERVER_SSH_KEY }}
          debug: true
          command: |
            echo '=== Testing basic SSH ==='
            whoami
            pwd
            echo '=== Git version ==='
            git --version
            echo '=== Systemctl ==='
            systemctl is-active styxproxy-api || echo 'service not active'
            echo '=== Done debug ==='
