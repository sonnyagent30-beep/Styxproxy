name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy to Interserver
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Ed25519 SSH key on runner
        run: |
          ssh-keygen -t ed25519 -f deploy_key -N '' -C 'gh-runner'
          chmod 600 deploy_key
          echo "Generated: $(ssh-keygen -lf deploy_key 2>&1 | awk '{print $2}')"

      - name: Add runner public key to VPS via webhook
        run: |
          PUBKEY=$(cat deploy_key.pub)
          echo "Adding pubkey to VPS..."
          HTTP_CODE=$(curl -s -o /tmp/addkey_resp.json -w "%{http_code}" -X POST http://162.35.184.69:9001/add-key \
            -H "X-API-Key: ${{ secrets.ADD_KEY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"pubkey\": \"$PUBKEY\"}")
          echo "HTTP code: $HTTP_CODE"
          echo "Response: $(cat /tmp/addkey_resp.json)"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "KEY_ADDED"
          else
            echo "Failed to add key (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Deploy to VPS
        run: |
          sleep 2
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 \
            -i deploy_key \
            root@162.35.184.69 "set -e && \
            cd /opt/styxproxy/repo && \
            git stash 2>/dev/null || true && \
            git pull origin main && \
            /opt/styxproxy/backend/venv/bin/pip install -q -r /opt/styxproxy/repo/backend/requirements.txt 2>/dev/null || true && \
            cp -r /opt/styxproxy/repo/backend/app /opt/styxproxy/backend/app && \
            cp -r /opt/styxproxy/repo/backend/alembic /opt/styxproxy/backend/alembic 2>/dev/null || true && \
            systemctl restart styxproxy-api && \
            sleep 8 && \
            HEALTH=$(curl -sf https://api.styxproxy.com/api/v1/health 2>/dev/null || curl -sf http://127.0.0.1:8000/api/v1/health 2>/dev/null || echo no-response) && \
            echo Health: $HEALTH && \
            echo $HEALTH | grep -q healthy && echo Deploy successful || exit 1"

      - name: Remove runner public key from VPS
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            -i deploy_key \
            root@162.35.184.69 \
            'grep -v "gh-runner" ~/.ssh/authorized_keys > ~/.ssh/authorized_keys.tmp && mv ~/.ssh/authorized_keys.tmp ~/.ssh/authorized_keys && echo KEY_REVOKED' \
            2>&1 || echo "Revoke failed (non-critical)"
