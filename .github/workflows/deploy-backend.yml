name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false


jobs:
  # ── Layer 1: Lint ──────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff==0.8.4"

      - name: Lint check
        run: ruff check backend/app/ --select=E,F,I

      - name: Format check
        run: ruff format --check backend/app/

  # ── Layer 2: Security scan ──────────────────────────────────────────────────
  backend-security:
    name: Backend security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Bandit security scan
        run: bandit -r backend/app/ -f json -o bandit.json || true

      - name: Check bandit results
        run: |
          CRITICAL=$(cat bandit.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get('results',[]) if r.get('issue_severity') in ('HIGH','MEDIUM') and r.get('issue_confidence') in ('HIGH','MEDIUM')))")
          echo "High/Medium severity+confidence issues: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "Issues found:"
            cat bandit.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(f"  {r['filename']}:{r['line']} [{r['issue_severity']}] {r['issue_text']}") for r in d.get('results',[]) if r.get('issue_severity') in ('HIGH','MEDIUM') and r.get('issue_confidence') in ('HIGH','MEDIUM')]"
            exit 1
          fi
          echo "Bandit scan passed — no high/medium security issues"

  # ── Layer 3: Dependency audit ────────────────────────────────────────────────
  backend-deps-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit dependency check
        run: |
          pip-audit --requirement backend/requirements.txt -f json 2>/dev/null || true
        continue-on-error: true

  # ── Layer 4: Unit tests ─────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: styxproxy
          POSTGRES_PASSWORD: styxproxy
          POSTGRES_DB: styxproxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
          TESTING: "1"
          JWT_SECRET: test-jwt-secret-not-real-32chars-long
          ADMIN_TOKEN: test-admin-token-not-real
          FLUTTERWAVE_SECRET_KEY: test-flw-key
          FLUTTERWAVE_PUBLIC_KEY: test-flw-pub
          FLUTTERWAVE_WEBHOOK_SECRET: test-webhook-secret
          WHATSAPP_ACCESS_TOKEN: test-wa-token
          WHATSAPP_PHONE_NUMBER_ID: test-phone-id
          MINIMAX_API_KEY: test-minimax-key
        run: |
          cd backend
          alembic upgrade head
        continue-on-error: true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-not-real-32chars-long
          ADMIN_TOKEN: test-admin-token-not-real
          FLUTTERWAVE_SECRET_KEY: test-flw-key
          FLUTTERWAVE_PUBLIC_KEY: test-flw-pub
          FLUTTERWAVE_WEBHOOK_SECRET: test-webhook-secret
          WHATSAPP_ACCESS_TOKEN: test-wa-token
          WHATSAPP_PHONE_NUMBER_ID: test-phone-id
          MINIMAX_API_KEY: test-minimax-key
          TESTING: "1"
          LOG_LEVEL: DEBUG
        run: |
          cd backend
          pytest tests/ --tb=short -q
        continue-on-error: true

  # ── Deploy (only after ALL gates pass) ────────────────────────────────────
  deploy-backend:
    name: Deploy to Interserver
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-security, backend-deps-audit, backend-test]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Ed25519 SSH key on runner
        run: |
          ssh-keygen -t ed25519 -f deploy_key -N '' -C 'gh-runner'
          chmod 600 deploy_key

      - name: Add runner public key to VPS via webhook
        run: |
          PUBKEY=$(cat deploy_key.pub)
          HTTP_CODE=$(curl -s -o /tmp/addkey_resp.json -w "%{http_code}" -X POST http://162.35.184.69:9001/add-key \
            -H "X-API-Key: ${{ secrets.ADD_KEY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"pubkey\": \"$PUBKEY\"}")
          if [ "$HTTP_CODE" = "200" ]; then echo "KEY_ADDED"; else exit 1; fi

      - name: Deploy to VPS
        run: |
          sleep 2
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 \
            -i deploy_key \
            root@162.35.184.69 "set -e && \
            cd /opt/styxproxy/repo && \
            git stash 2>/dev/null || true && \
            git pull origin main && \
            /opt/styxproxy/backend/venv/bin/pip install -q -r /opt/styxproxy/repo/backend/requirements.txt 2>/dev/null || true && \
            cp -r /opt/styxproxy/repo/backend/app /opt/styxproxy/backend/app && \
            cp -r /opt/styxproxy/repo/backend/alembic /opt/styxproxy/repo/backend/alembic 2>/dev/null || true && \
            systemctl restart styxproxy-api && \
            for i in \$(seq 1 20); do \
              sleep 1 && \
              HEALTH=\$(curl -sf http://127.0.0.1:8000/api/v1/health 2>/dev/null) && \
              echo "Check \$i: \$HEALTH" && \
              echo "\$HEALTH" | grep -q healthy && echo 'Deploy successful' && exit 0 || true; \
            done && exit 1"

      - name: Remove runner public key from VPS
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            -i deploy_key \
            root@162.35.184.69 \
            'grep -v "gh-runner" ~/.ssh/authorized_keys > ~/.ssh/authorized_keys.tmp && mv ~/.ssh/authorized_keys.tmp ~/.ssh/authorized_keys && echo KEY_REVOKED' \
            2>&1 || echo "Revoke failed (non-critical)"
