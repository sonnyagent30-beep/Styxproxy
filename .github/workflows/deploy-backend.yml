name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  VPS_HOST: 162.35.184.69
  VPS_USER: root
  VPS_REPO: /opt/styxproxy/repo
  VPS_BACKEND_CODE: /opt/styxproxy/backend

jobs:
  deploy-backend:
    name: Deploy to Interserver
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.INTERSERVER_SSH_KEY }}
          script: |
            set -e
            echo '=== Pulling latest code ==='
            cd ${{ env.VPS_REPO }}
            git stash || true
            git pull origin main

            echo '=== Installing dependencies ==='
            ${{ env.VPS_BACKEND_CODE }}/venv/bin/pip install -q -r ${{ env.VPS_REPO }}/backend/requirements.txt 2>/dev/null || true

            echo '=== Syncing code ==='
            cp -r ${{ env.VPS_REPO }}/backend/app ${{ env.VPS_BACKEND_CODE }}/app
            cp -r ${{ env.VPS_REPO }}/backend/alembic ${{ env.VPS_BACKEND_CODE }}/alembic 2>/dev/null || true

            echo '=== Restarting service ==='
            systemctl restart styxproxy-api

            echo '=== Health check ==='
            sleep 8
            HEALTH=$(curl -sf https://api.styxproxy.com/api/v1/health 2>/dev/null || curl -sf http://127.0.0.1:8000/api/v1/health 2>/dev/null || echo 'no-response')
            echo "Health: $HEALTH"
            if echo "$HEALTH" | grep -q 'healthy'; then
              echo 'Deploy successful'
            else
              echo 'WARNING: health check did not return healthy'
              exit 1
            fi
