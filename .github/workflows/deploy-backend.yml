name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy to Interserver
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Write SSH key
        run: |
          mkdir -p /tmp/ssh
          echo "${{ secrets.INTERSERVER_SSH_KEY }}" > /tmp/ssh/key
          chmod 600 /tmp/ssh/key
          echo "Key bytes: $(wc -c < /tmp/ssh/key)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: 162.35.184.69
          username: root
          key_path: /tmp/ssh/key
          command_timeout: 10m
          script: |
            set -e
            cd /opt/styxproxy/repo
            git stash || true
            git pull origin main
            /opt/styxproxy/backend/venv/bin/pip install -q -r /opt/styxproxy/repo/backend/requirements.txt 2>/dev/null || true
            cp -r /opt/styxproxy/repo/backend/app /opt/styxproxy/backend/app
            cp -r /opt/styxproxy/repo/backend/alembic /opt/styxproxy/backend/alembic 2>/dev/null || true
            systemctl restart styxproxy-api
            sleep 8
            HEALTH=$(curl -sf https://api.styxproxy.com/api/v1/health 2>/dev/null || echo 'no-response')
            echo "Health: $HEALTH"
            echo $HEALTH | grep -q 'healthy' && echo 'Deploy successful' || exit 1
