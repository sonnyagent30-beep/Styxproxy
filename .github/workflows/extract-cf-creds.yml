name: Extract CF Credentials
on:
  push:
    branches: [main]
jobs:
  get-creds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract CF creds
        env:
          CF_TOKEN: *** secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: *** secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/cf-out
          echo -n "$CF_TOKEN" > /tmp/cf-out/token.txt
          echo -n "$CF_ACCT" > /tmp/cf-out/acct.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cf-creds
          path: /tmp/cf-out/
