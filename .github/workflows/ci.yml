# Pinned to commit SHA (see https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions)
# Update SHAs via dependabot or manually via: git ls-remote https://github.com/<org>/<repo>.git refs/tags/<tag>^{}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    # NOT continue-on-error. This job previously carried
    # `continue-on-error: true` at both job and step level, which is why 21
    # tests could stay red for the entire life of the tree with every PR
    # green. See backend/scripts/ci_backend_gate.py for the ratchet that keeps
    # known failures tolerated without letting new ones through.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: styxproxy
          POSTGRES_PASSWORD: styxproxy
          POSTGRES_DB: styxproxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run database migrations
        # NOT continue-on-error. The stale "migration 001 has FK ordering bug"
        # TODO that sat here is resolved as of t_2af95a6b: `alembic upgrade head`
        # now reaches head on a clean Postgres 16 (verified, exit 0, 29 upgrade
        # steps, single head). Nine distinct defects were fixed to get there —
        # see the card handoff and backend/alembic/versions/ for the
        # per-revision notes.
        #
        # This step MUST block. Every DB-dependent test depends on it, and when
        # it was allowed to fail silently the suite ran against a database with
        # no `alembic_version` and an empty `plans` table.
        env:
          DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
          TESTING: "1"
          JWT_SECRET: test-jwt-secret-not-real-32chars-long
          ADMIN_TOKEN: test-admin-token-not-real
          FLUTTERWAVE_SECRET_KEY: test-flw-key
          FLUTTERWAVE_PUBLIC_KEY: test-flw-pub
          FLUTTERWAVE_WEBHOOK_SECRET: test-webhook-secret
          WHATSAPP_ACCESS_TOKEN: test-wa-token
          WHATSAPP_PHONE_NUMBER_ID: test-phone-id
          MINIMAX_API_KEY: test-minimax-key
        run: |
          cd backend
          alembic upgrade head

      - name: Check schema parity (migrations vs models)
        # `alembic upgrade head` succeeding is NOT proof the schema is usable.
        # It says the chain ran, not that the result satisfies app/models.py.
        # Those were different until t_e7fbfe21: the chain reached head while
        # leaving 14 model tables uncreated and 11 tables missing columns, so
        # on a clean database admin login raised
        # `column admin_auth.email does not exist` and residential orders hit
        # `column plans.price_per_gb does not exist`.
        #
        # It stayed invisible because production was grown by
        # Base.metadata.create_all in app/main.py's lifespan, not by alembic.
        # This step is what stops that class of drift returning: any model
        # change without a matching revision fails the build.
        #
        # Runs against the same migrated database the tests use, so it is a
        # check of the real artifact rather than a separate schema build.
        env:
          DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
          TESTING: "1"
          JWT_SECRET: test-jwt-secret-not-real-32chars-long
          ADMIN_TOKEN: test-admin-token-not-real
          FLUTTERWAVE_SECRET_KEY: test-flw-key
          FLUTTERWAVE_PUBLIC_KEY: test-flw-pub
          FLUTTERWAVE_WEBHOOK_SECRET: test-webhook-secret
          MINIMAX_API_KEY: test-minimax-key
          OPS_JWT_SECRET: test-ops-jwt-secret-not-real-32chars
          THEOREM_REACH_WEBHOOK_SECRET: test-theorem-webhook
          SCHEMA_DRIFT_DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
        run: |
          cd backend
          python scripts/schema_drift_report.py

      - name: Run tests (gated)
        # NOT continue-on-error. Previously this step AND the job both carried
        # `continue-on-error: true`, so a failing pytest run could not fail the
        # workflow at all.
        #
        # The gate fails the build on any test that fails and is not listed in
        # backend/ci_known_failures.txt, and refuses baseline entries added
        # without a written reason. It also reports entries that now pass so
        # they can be deleted. Do not replace this with a bare `pytest` call.
        env:
          DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-not-real-32chars-long
          ADMIN_TOKEN: test-admin-token-not-real
          FLUTTERWAVE_SECRET_KEY: test-flw-key
          FLUTTERWAVE_PUBLIC_KEY: test-flw-pub
          FLUTTERWAVE_WEBHOOK_SECRET: test-webhook-secret
          WHATSAPP_ACCESS_TOKEN: test-wa-token
          WHATSAPP_PHONE_NUMBER_ID: test-phone-id
          MINIMAX_API_KEY: test-minimax-key
          TESTING: "1"
          LOG_LEVEL: DEBUG
          # Opts tests/test_schema_parity.py in. Without it that file skips,
          # and the regression guard for migration drift silently stops
          # guarding. Point it at the same migrated database the suite uses.
          SCHEMA_DRIFT_DATABASE_URL: postgresql+asyncpg://styxproxy:styxproxy@localhost:5432/styxproxy_test
        run: |
          cd backend
          python scripts/ci_backend_gate.py

  backend-lint:
    name: Backend lint (ruff) [advisory]
    # ADVISORY — deliberately non-gating, decided in t_2af95a6b.
    #
    # Measured on main @ 036eca9d: `ruff check app/ --select=E,F,I` reports 507
    # errors and `ruff format --check` would reformat 53 files. Gating this now
    # would make main permanently red on the first push, which is the exact
    # outcome t_2af95a6b was created to prevent.
    #
    # It is still non-ignored: the `|| true` below is what keeps it advisory.
    # Remove the `|| true` and the job-level continue-on-error together, once
    # the counts reach zero. Owner: unassigned — needs a cleanup card.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff==0.8.4"

      - name: Lint check
        run: ruff check backend/app/ --select=E,F,I || true

      - name: Format check
        run: ruff format --check backend/app/ || true

  backend-typecheck:
    name: Backend typecheck (mypy) [advisory]
    # ADVISORY — deliberately non-gating, decided in t_2af95a6b.
    #
    # Measured on main @ 036eca9d: mypy reports 141 errors across 33 files.
    # Same reasoning as backend-lint: gating now turns main permanently red.
    # Remove the `|| true` and the job-level continue-on-error together, once
    # the count reaches zero. Owner: unassigned — needs a cleanup card.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install backend
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install mypy==1.13.0

      - name: mypy check (relaxed — backend has no strict mode yet)
        run: |
          cd backend
          mypy app/ --ignore-missing-imports --no-strict-optional || true
        continue-on-error: true

  frontend-lint:
    name: Frontend lint (eslint) [advisory]
    # ADVISORY — deliberately non-gating, decided in t_2af95a6b.
    #
    # Currently BROKEN, not merely red: `npm run lint` dies with
    # ERR_MODULE_NOT_FOUND for 'eslint-config-next/core-web-vitals' imported
    # from eslint.config.mjs, so no lint result is produced at all. Measured on
    # main @ 036eca9d. Owner: unassigned — needs a cleanup card.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # ADVISORY — see the job-level note above. Remove this continue-on-error
        # once `npm run lint` runs successfully and reports zero problems.
        continue-on-error: true
        run: npm run lint

  frontend-typecheck:
    name: Frontend typecheck (tsc) [advisory]
    # ADVISORY — deliberately non-gating, decided in t_2af95a6b.
    #
    # Measured on main @ 036eca9d: `npx tsc --noEmit` reports 80 TypeScript
    # errors (e.g. src/lib/api.ts:943 "Cannot find name 'CatalogTemplate'",
    # src/lib/api.ts:1296 "Duplicate function implementation"). Gating now
    # turns main permanently red. Owner: unassigned — needs a cleanup card.
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  structure:
    name: Structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check required files exist
        run: |
          test -f backend/app/main.py
          test -f backend/app/models.py
          test -f backend/app/config.py
          test -f backend/alembic/versions/001_initial.py
          test -f .gitleaks/gitleaks.toml
          test -f .githooks/pre-commit
          test -f .github/workflows/ci.yml
          test -f .github/workflows/gitleaks.yml
          echo "All required files present"
