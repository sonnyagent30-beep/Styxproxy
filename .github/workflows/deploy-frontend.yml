name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'vercel.json'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.styxproxy.com

      - name: Deploy to Vercel Production
        run: |
          cd frontend
          # Create zip of .next and all needed frontend files
          zip -r deploy.zip .next public package.json package-lock.json next.config.ts .env.production 2>/dev/null || \
            zip -r deploy.zip .next public package.json package-lock.json next.config.ts 2>/dev/null
          
          # Upload to Vercel via API
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          
          # Get project ID
          PROJECT_ID=$(curl -s "https://api.vercel.com/v2/projects?search=bunche-api-push" \
            -H "Authorization: Bearer $TOKEN" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['projects'][0]['id'])")
          echo "Project ID: $PROJECT_ID"
          
          # Upload file
          FILE_RESP=$(curl -s -X POST \
            "https://api.vercel.com/v2/files" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@deploy.zip")
          FILE_ID=$(echo "$FILE_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('uid',''))")
          echo "File ID: $FILE_ID"
          
          # Deploy
          DEPLOY_RESP=$(curl -s -X POST \
            "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"projectId\": \"$PROJECT_ID\", \"files\": [{\"file\": \"deploy.zip\", \"data\": \"$FILE_ID\", \"encoding\": 1}], \"projectSettings\": {\"framework\": \"nextjs\", \"buildCommand\": \"\", \"outputDirectory\": \".next\", \"installCommand\": \"\"}}")
          echo "$DEPLOY_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Deployed:', d.get('url','FAILED'))"
