name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'vercel.json'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.styxproxy.com

      - name: Deploy to Vercel Production
        run: |
          cd frontend

          # Create zip
          zip -r deploy.zip .next public package.json package-lock.json next.config.ts 2>/dev/null

          # Base64-encode (Vercel expects inline base64, not separate file upload)
          ZIP_B64=$(base64 -w 0 deploy.zip)

          # Get project ID
          PROJECT_ID=$(curl -s "https://api.vercel.com/v2/projects?search=bunche-api-push" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'])")
          echo "Project: $PROJECT_ID"

          # Deploy with inline base64 file
          RESP=$(curl -s -X POST \
            "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"projectId\": \"$PROJECT_ID\",
              \"files\": [{\"file\": \"deploy.zip\", \"data\": \"$ZIP_B64\", \"encoding\": \"base64\"}],
              \"projectSettings\": {
                \"framework\": \"nextjs\",
                \"buildCommand\": \"\",
                \"outputDirectory\": \".next\",
                \"installCommand\": \"\"
              }
            }")

          echo "Response: $RESP"
          URL=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('url','FAILED: '+str(d.get('error',d))))")
          echo "Deployed: $URL"
          echo "deploy-url=$URL" >> $GITHUB_OUTPUT

          if echo "$URL" | grep -q "FAILED"; then exit 1; fi
