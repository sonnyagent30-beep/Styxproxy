name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'vercel.json'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Inspect vercel project
        run: |
          echo "=== vercel.json ==="
          cat vercel.json
          echo ""
          echo "=== Vercel CLI version ==="
          npx vercel --version
          echo ""
          echo "=== Login status ==="
          npx vercel whoami --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 || true
          echo ""
          echo "=== Try pulling project config ==="
          npx vercel project ls --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | head -10 || true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy to Vercel Production
        run: |
          npx vercel --prod --token "${{ secrets.VERCEL_TOKEN }}" --yes --debug 2>&1 | tail -20
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
