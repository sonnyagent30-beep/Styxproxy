name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'vercel.json'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.styxproxy.com

      - name: Deploy to Vercel Production
        run: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os

          token = os.environ['VERCEL_TOKEN']
          headers = {'Authorization': f'Bearer {token}'}

          # --- Find project ID ---
          result = subprocess.run(
              ['curl', '-s', 'https://api.vercel.com/v2/projects?search=bunche-api-push',
               '-H', f'Authorization: Bearer {token}'],
              capture_output=True, text=True
          )
          projects = json.loads(result.stdout)
          project_id = projects[0]['id']
          print(f'Project ID: {project_id}')

          # --- Zip .next + public + config ---
          os.chdir('/home/runner/work/Styxproxy/Styxproxy/frontend')
          result = subprocess.run(['zip', '-r', 'deploy.zip', '.next', 'public',
                                  'package.json', 'package-lock.json', 'next.config.ts'],
                                 capture_output=True, text=True)
          print(f'Zip: {result.stdout.strip()}')

          # --- Upload file via Vercel API ---
          with open('deploy.zip', 'rb') as f:
              import urllib.request
              req = urllib.request.Request(
                  'https://api.vercel.com/v2/files',
                  data=f.read(),
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/octet-stream'},
                  method='POST'
              )
              with urllib.request.urlopen(req) as resp:
                  file_resp = json.loads(resp.read())
          file_id = file_resp['uid']
          print(f'File ID: {file_id}')

          # --- Deploy ---
          deploy_payload = json.dumps({
              'projectId': project_id,
              'files': [{'file': 'deploy.zip', 'data': file_id, 'encoding': 1}],
              'projectSettings': {
                  'framework': 'nextjs',
                  'buildCommand': '',
                  'outputDirectory': '.next',
                  'installCommand': ''
              }
          }).encode()

          req = urllib.request.Request(
              'https://api.vercel.com/v13/deployments',
              data=deploy_payload,
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req) as resp:
              deploy_resp = json.loads(resp.read())

          url = deploy_resp.get('url', 'UNKNOWN')
          print(f'Deployed: {url}')

          if not url or url == 'UNKNOWN':
              print('ERROR: Deployment failed - no URL returned')
              print(json.dumps(deploy_resp)[:500])
              sys.exit(1)
          else:
              print(f'SUCCESS: {url}')
          PYEOF
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
