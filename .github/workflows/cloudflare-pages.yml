name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [cpt-admin-ui]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.styxproxy.com
          NEXT_PUBLIC_SITE_URL: https://styxproxy-staging.pages.dev

      - name: Create Cloudflare Pages project & deploy
        run: |
          # Get Cloudflare account
          ACCOUNT=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "Account: $ACCOUNT"

          # Create or get project
          PROJECT="styxproxy-staging"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$PROJECT\",\"slug\":\"$PROJECT\",\"build_config\":{\"build_command\":\"npm run build\",\"destination_dir\":\".next\",\"root_distribution\":false}}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project created:', d.get('success'))"

          # Create deployment
          ZIP=".next-deploy.zip"
          cd frontend/.next
          zip -r "$ZIP" . > /dev/null 2>&1

          DEPLOY_RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/$PROJECT/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -F "file=@$ZIP" \
            -F "manifest={\"version\":1,\"paths\":{\"/\":{\"沙漠\":\"/_next/static/chunks/app/page-hash.js\"}}}" 2>/dev/null)

          echo "$DEPLOY_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy URL:', d.get('result',{}).get('url', d.get('errors')))"
