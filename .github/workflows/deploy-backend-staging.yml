name: Deploy Backend to Staging

on:
  push:
    branches:
      - cpt-admin-ui
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-staging.yml'
  workflow_dispatch:

concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend to Staging VPS
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate ephemeral deploy key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f /tmp/deploy_key -N "" -C "github-runner-staging-$(date +%s)"
          echo "DEPLOY_PUBKEY=$(cat /tmp/deploy_key.pub)" >> $GITHUB_ENV
          echo "DEPLOY_PRIVKEY<<EOF" >> $GITHUB_ENV
          cat /tmp/deploy_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Trigger webhook on VPS (add key)
        run: |
          RESPONSE=$(curl -s -X POST http://162.35.184.69:9001/add-key \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.ADD_KEY_API_KEY }}" \
            -d "{\"pubkey\": \"${{ env.DEPLOY_PUBKEY }}\"}")
          echo "Webhook response: $RESPONSE"
          if echo "$RESPONSE" | grep -qE '"(added|success)"'; then
            echo "Key added"
          else
            echo "Key addition failed"
            exit 1
          fi

      - name: Pull, sync code, and restart staging backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 162.35.184.69
          username: root
          key: ${{ env.DEPLOY_PRIVKEY }}
          timeout: 300s
          script: |
            set -e
            echo "=== Step 1: Update git repo ==="
            cd /opt/styxproxy/repo
            git fetch origin cpt-admin-ui
            git reset --hard origin/cpt-admin-ui
            echo "Repo updated to latest cpt-admin-ui"

            echo "=== Step 2: Sync backend code to runtime location ==="
            # The systemd service runs uvicorn from /opt/styxproxy/backend
            # Sync the backend/ dir from the repo to the runtime location
            if [ -d /opt/styxproxy/backend ]; then
              echo "Syncing backend files..."
              # Use rsync to copy all files, preserving the venv directory
              rsync -a --delete \
                --exclude='venv' \
                --exclude='__pycache__' \
                --exclude='*.pyc' \
                --exclude='data' \
                --exclude='.pytest_cache' \
                /opt/styxproxy/repo/backend/ \
                /opt/styxproxy/backend/
              echo "Backend files synced"
            else
              echo "ERROR: /opt/styxproxy/backend does not exist"
              exit 1
            fi

            echo "=== Step 3: Restart all styxproxy services ==="
            # Try to find and restart all styxproxy-related services
            SERVICES=$(systemctl list-units --type=service --all --no-legend | grep -i styx | awk '{print $1}')
            if [ -n "$SERVICES" ]; then
              echo "Found styxproxy services: $SERVICES"
              for svc in $SERVICES; do
                echo "Restarting $svc..."
                systemctl restart "$svc" || echo "  (failed to restart $svc)"
              done
              echo "All styxproxy services restarted"
            else
              echo "No styxproxy services found via systemctl"
              echo "Checking docker containers..."
              if [ -f /opt/styxproxy/infrastructure/docker-compose.yml ]; then
                cd /opt/styxproxy/infrastructure
                docker compose -f docker-compose.yml ps
                docker compose -f docker-compose.yml restart api || echo "docker restart failed"
              fi
            fi

      - name: Wait for backend to start
        run: |
          echo "Waiting 30s for backend to start..."
          sleep 30
          echo "Done waiting"

      - name: Health check staging backend
        run: |
          for i in $(seq 1 10); do
            sleep 3
            # Test both 8000 and 8001, and the public URL
          for url in "http://162.35.184.69:8001" "http://162.35.184.69:8000" "https://api.styxproxy.com"; do
            for ep in "/api/v1/health" "/health"; do
              RESP=$(curl -sf "$url$ep" 2>/dev/null)
              if [ $? -eq 0 ]; then
                echo "Healthy at $url$ep: $RESP"
                # Verify new endpoint works
                if curl -sf "$url/api/countries" 2>/dev/null | grep -q "countries"; then
                  echo "✓ /api/countries works on $url"
                  exit 0
                fi
              fi
            done
          done
          echo "Warning: new /api/countries endpoint not detected - deploy may not have reached live service"
            echo "Attempt $i/10..."
          done
          echo "Health check did not succeed"
          exit 1

      - name: Remove deploy key
        if: always()
        run: |
          curl -sf -X POST http://162.35.184.69:9001/remove-key \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.ADD_KEY_API_KEY }}" \
            -d "{\"pubkey\": \"${{ env.DEPLOY_PUBKEY }}\"}" || true
