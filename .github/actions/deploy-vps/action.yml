name: Deploy to VPS via SSH
description: Writes SSH key to action dir then runs SSH on the runner itself
runs:
  using: composite
  steps:
    - name: Write SSH key to action dir
      shell: bash
      run: |
        KEY_FILE=${{ github.action_path }}/gh_key
        printf '%s' "${{ inputs.ssh_key }}" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"
        echo "Key file: $KEY_FILE"
        ls -la "$KEY_FILE"
        wc -c < "$KEY_FILE"
    - name: Deploy via SSH
      shell: bash
      run: |
        KEY_FILE=${{ github.action_path }}/gh_key
        echo "Using key: $KEY_FILE"
        ls -la "$KEY_FILE" 2>&1 || echo 'KEY FILE MISSING'
        ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ inputs.username }}@${{ inputs.host }} 'whoami; echo OK'
