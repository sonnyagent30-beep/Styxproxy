[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["backend/tests", "backend/alembic"]

[tool.ruff.lint]
# Same as CI: --select=E,F,I
select = ["E", "F", "I"]
ignore = [
    # Whitespace before punctuation (auto-fixable, stylistic)
    "E203",
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files (re-exports)
"__init__.py" = ["F401"]
# Tests can have unused imports during setup
"tests/**/*.py" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"