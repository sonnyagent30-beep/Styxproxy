# /etc/danted.conf — Styxproxy Dante SOCKS5 server
# Generated Jul 28 2026 for Sprint 24 multi-server fleet

internal: 0.0.0.0 port = 1080
external: eth0

# Auth layer: bsdauth (control API writes to /etc/dante/danted.passwd)
user.privileged: root
user.unprivileged: nobody

socksmethod: username

# Logging
logoutput: stdout

# Allow all clients (auth enforced by danted.passwd entry)
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect
}

# Pass all SOCKS requests
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect
}

# Block private LAN ranges (SOCKS user can connect outside only)
socks block {
    from: 0.0.0.0/0 to: 10.0.0.0/8
    log: connect
}
socks block {
    from: 0.0.0.0/0 to: 172.16.0.0/12
    log: connect
}
socks block {
    from: 0.0.0.0/0 to: 192.168.0.0/16
    log: connect
}
