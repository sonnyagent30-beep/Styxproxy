# /etc/sockd.conf — Styxproxy Dante SOCKS5 server on Interserver (SECONDARY)
#
# Mirrors the Contabo config but bound for the US-East audience.
# Auth: PAM (sockd PAM service reads /etc/dante/sockd.shadow via pam_pwdfile)
# SOCKS port: 1080
# Auth proxy port: 1081 (socks-auth-proxy container/service)

internal: 0.0.0.0 port = 1080
external: eth0

# Auth: NONE at dante level - socks-auth-proxy handles auth (we block external access)
socksmethod: none

# Logging
logoutput: syslog stdout

# ONLY allow connections from the socks-auth-proxy (which binds 127.0.0.1 + eth0 in production)
client pass {
    from: 127.0.0.0/8 to: 0.0.0.0/0
    log: connect
}
client pass {
    from: 172.17.0.0/16 to: 0.0.0.0/0
    log: connect
}
client pass {
    from: 10.0.0.0/8 to: 0.0.0.0/0
    log: connect
}

# SOCKS pass for all destinations (auth-proxy sends user through)
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect
}

# Block private LAN ranges (SOCKS user connects OUT only)
socks block {
    from: 0.0.0.0/0 to: 10.0.0.0/8
    log: connect
}
socks block {
    from: 0.0.0.0/0 to: 172.16.0.0/12
    log: connect
}
socks block {
    from: 0.0.0.0/0 to: 192.168.0.0/16
    log: connect
}
