# Styxproxy n8n reverse-proxy — port 5679 → 127.0.0.1:5678
server {
    listen 5679 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Only allow POST on /webhook/* to limit traffic
    location /webhook/ {
        limit_req zone=n8n_webhook_limit burst=60 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream http_502;
    }

    # Web UI
    location / {
        # Allow localhost and Cloudflare IPs only via allowlist
        allow 127.0.0.1;
        allow 162.35.184.69;
        deny all;
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
