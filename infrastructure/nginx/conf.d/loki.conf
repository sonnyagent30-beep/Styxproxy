server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loki.styxproxy.com;

    ssl_certificate     /etc/letsencrypt/live/loki.styxproxy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loki.styxproxy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Loki has NO built-in auth (auth_enabled: false), so nginx enforces it.
    auth_basic "Styxproxy Loki";
    auth_basic_user_file /etc/nginx/.htpasswd-loki;

    # keep request bodies sane for log pushes
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name loki.styxproxy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
