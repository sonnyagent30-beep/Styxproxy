# /etc/danted.conf — Styxproxy secondary Dante SOCKS5 server
# Configured during Sprint 24 migration

# Network
internal: 0.0.0.0 port = 1080
external: eth0
user.privileged: root
user.unprivileged: nobody

# Authentication: PAM (we'll switch to custom script later)
socksmethod: username none

# Logging
logoutput: syslog /var/log/danted.log

# Client rules — allow everyone (auth happens at app layer)
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect iooperation
}

# SOCKS pass rules
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect iooperation
}

# Block private networks (no LAN access)
socks block {
    from: 0.0.0.0/0 to: 10.0.0.0/8
    log: connect
}
socks block {
    from: 0.0.0.0/0 to: 172.16.0.0/12
    log: connect
}
socks block {
    from: 0.0.0.0/0 to: 192.168.0.0/16
    log: connect
}
socks block {
    from: 0.0.0.0/0 to: 127.0.0.0/8
    log: connect
}
