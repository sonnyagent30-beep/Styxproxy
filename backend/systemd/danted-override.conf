[Service]
# ── Version pin ────────────────────────────────────────────────────────────────
# Dante binary pinned at install time (apt-mark hold dante-server).
# To upgrade: apt-mark unhold dante-server && apt install dante-server
# Never upgrade without testing on staging first.

# ── Auto-restart on crash ────────────────────────────────────────────────────
Restart=on-failure
RestartSec=10s

# Stop restarting if Dante crashes more than 5 times in 60 seconds
StartLimitBurst=5
StartLimitIntervalSec=60

# ExecPost: log crash to file + email alert after burst limit
ExecStartPost=-/usr/local/bin/dante_crash_handler.sh

# ── Resource limits ──────────────────────────────────────────────────────────
MemoryMax=200M
CPUQuota=50%

# ── Logging ──────────────────────────────────────────────────────────────────
StandardOutput=journal
StandardError=journal
