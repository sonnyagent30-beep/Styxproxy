[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "styxproxy-backend"
version = "1.0.0"
description = "Styxproxy Backend API"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E203",  # whitespace before punctuation, stylistic
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
