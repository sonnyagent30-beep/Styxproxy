[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "styxproxy-backend"
version = "1.0.0"
description = "Styxproxy Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "pydantic[email]==2.13.4",
    "email-validator>=2.0.0",
    "reportlab>=4.0.0",
    "pydantic-settings==2.15.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "pyotp>=2.9.0",
    "httpx==0.28.1",
    "slowapi==0.1.10",
    "structlog==26.1.0",
    "sentry-sdk==2.68.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
    "sentry-sdk[fastapi]==2.68.0",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-xdist==3.8.0",
    "aiosqlite==0.22.1",
    "ruff==0.16.3",
    "black==25.1.0",
    "pre-commit==4.6.2",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E203",  # whitespace before punctuation, stylistic
    "E402",  # module-level import not at top (allowed in this codebase)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "F841"]
"app/routers/orders.py" = ["E501"]   # HTML f-string template
"app/dependencies/idempotency.py" = ["F841", "E501"]  # unused `now` var; long HTTPException lines
"app/routers/customers.py" = ["F841"]  # unused `now` var in delete function
"app/routers/ops.py" = ["F841"]        # intentionally unused refund_result var
"app/routers/admin.py" = ["E501"]      # long route decorator lines
"app/routers/permissions.py" = ["E501"] # long dict line
"app/services/flutterwave.py" = ["E501"]  # long failure_message line
"app/schemas.py" = ["E402"]           # uuid import mid-file
"app/routers/schemas.py" = ["E402"]   # uuid import mid-file

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--tb=short"]
