[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "styxproxy-backend"
version = "1.0.0"
description = "Styxproxy Backend API"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi==0.133.1",
    "uvicorn[standard]==0.41.0",
    # Database
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.13.2",
    # Data Validation
    "pydantic[email]==2.13.4",
    "email-validator>=2.0.0",
    "reportlab>=4.0.0",
    "pydantic-settings==2.14.2",
    # Authentication
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "pyotp>=2.9.0",
    # HTTP Client
    "httpx==0.28.1",
    # Rate Limiting
    "slowapi==0.1.10",
    # Logging & Monitoring
    "structlog==26.1.0",
    "sentry-sdk==2.64.0",
    # Utilities
    "python-multipart==0.0.27",
    "python-dotenv==1.2.2",
    # Observability + Caching
    "sentry-sdk[fastapi]==2.64.0",
    "redis==8.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-xdist==3.6.1",
    "aiosqlite==0.20.0",
    "ruff==0.16.0",
    "black==25.1.0",
    "pre-commit==4.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E203",  # whitespace before punctuation, stylistic
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "F841"]
"app/routers/orders.py" = ["E501"]  # HTML f-string template

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--tb=short"]
