# Pre-commit hooks for Styxproxy
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # 1. Gitleaks - secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.3
    hooks:
      - id: gitleaks

  # 2. Ruff - Python linting & formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # 3. ESLint - JavaScript/TypeScript linting (frontend)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: ^frontend/
        types: [javascript, jsx, typescript, tsx]

  # 4. Trailing whitespace fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']

  # 5. Detect secrets (additional to gitleaks)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
